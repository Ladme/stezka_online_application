[project]
name = "stezka_online_application"
version = "0.1.0"
description = "Online application for our children's camping club"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "nicegui>=3.16.0",
    "pillow>=12.3.0",
    "pydantic[email]>=2.13.5",
    "python-dotenv>=1.2.3",
    "qrplatba[png]>=1.2.0",
    "typst>=0.15.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "ruff>=0.16.6",
    "ty>=0.0.80",
]

[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"

[project.scripts]
stezka-online-application = "stezka_online_application.main:main"
