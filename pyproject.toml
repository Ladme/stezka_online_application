[project]
name = "stezka_online_application"
version = "0.1.0"
description = "Online application to our children's camping club"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "nicegui>=3.16.0",
    "pydantic[email]>=2.13.5",
    "python-dotenv>=1.2.3",
    "typst>=0.15.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.1",
    "ruff>=0.14.6",
    "ty>=0.0.34",
]

[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"

[project.scripts]
stezka-online-application = "stezka_online_application.main:main"
